default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: listen2me_development

test:
  <<: *default
  database: listen2me_test

production:
  <<: *default
  # Host, database, and credentials come from DATABASE_URL. Setting them here
  # as well would win over the URL and pin the connection to a local socket.
  url: <%= ENV["DATABASE_URL"] %>
