default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: listen2me_development

test:
  <<: *default
  database: listen2me_test

production:
  <<: *default
  database: listen2me_production
  username: listen2me
  password: <%= ENV["LISTEN2ME_DATABASE_PASSWORD"] %>
