name: Container Image

on:
  workflow_call:
    inputs:
      push:
        description: Push the built image to GHCR
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      push:
        description: Push the built image to GHCR
        required: true
        type: boolean
        default: true
  # Weekly rebuild without cache, so Debian security updates reach the image
  # even when the code does not change (see the apt-get upgrade in the Dockerfile).
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The scheduled rebuild has no inputs and always pushes.
  PUSH: ${{ inputs.push || github.event_name == 'schedule' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The image plus Trivy's DBs (the Java DB alone is ~1 GB) can overflow
      # the runner's free disk; the preinstalled SDKs below are unused here.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read from git, not github.event: head_commit is empty on workflow_dispatch
      # and workflow_run, and github.sha can differ from the commit checked out.
      - name: Read commit info
        id: commit
        run: |
          subject=$(git log -1 --format=%s)
          # " and # would be misparsed by the docker actions' list inputs
          subject=${subject//\"/\'}
          subject=${subject//#/}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=${subject:0:200}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.description=${{ steps.commit.outputs.subject }}

      # Build once into the local Docker daemon and scan it before anything is
      # pushed; the push step below reuses the layers from the gha cache.
      - name: Build image for the vulnerability scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: scan-local:${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=listen2me
          cache-to: type=gha,mode=max,scope=listen2me
          platforms: linux/amd64

      # Pinned Trivy image run directly: aquasecurity/trivy-action was
      # compromised in 2026-03. Fails on fixable CRITICAL findings only;
      # exceptions go into .trivyignore with a reason.
      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln --severity CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 --no-progress \
            scan-local:${{ steps.commit.outputs.sha }}

      - name: Build and push image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            index:org.opencontainers.image.description=${{ steps.commit.outputs.subject }}
          cache-from: type=gha,scope=listen2me
          cache-to: type=gha,mode=max,scope=listen2me
