name: Container Image

on:
  workflow_call:
    inputs:
      push:
        description: Push the built image to GHCR
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      push:
        description: Push the built image to GHCR
        required: true
        type: boolean
        default: true

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read from git, not github.event: head_commit is empty on workflow_dispatch
      # and workflow_run, and github.sha can differ from the commit checked out.
      - name: Read commit info
        id: commit
        run: |
          subject=$(git log -1 --format=%s)
          # " and # would be misparsed by the docker actions' list inputs
          subject=${subject//\"/\'}
          subject=${subject//#/}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=${subject:0:200}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.description=${{ steps.commit.outputs.subject }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            index:org.opencontainers.image.description=${{ steps.commit.outputs.subject }}
          cache-from: type=gha,scope=listen2me
          cache-to: type=gha,mode=max,scope=listen2me
