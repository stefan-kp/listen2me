services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  web:
    build: .
    #command: ["./bin/thrust", "./bin/rails", "server", "-b", "0.0.0.0"]
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
      - "80:80"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/listen2me
      RAILS_ENV: development
      SECRET_KEY_BASE: development_key_123
      TARGET_PORT: 3000
      DEBUG: "true"
      LITELLM_HOST: ${LITELLM_HOST:-}
      LITELLM_SECRET: ${LITELLM_SECRET:-}
      LITELLM_FAST_MODEL: ${LITELLM_FAST_MODEL:-fast}
      LITELLM_CHEAP_MODEL: ${LITELLM_CHEAP_MODEL:-cheap}
      LITELLM_TIMEOUT_SECONDS: ${LITELLM_TIMEOUT_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-marin}
      OPENAI_CUSTOM_VOICE_ID: ${OPENAI_CUSTOM_VOICE_ID:-}
      OPENAI_TTS_FIRST_BYTE_TIMEOUT: ${OPENAI_TTS_FIRST_BYTE_TIMEOUT:-8}
      OPENAI_TTS_TOTAL_TIMEOUT: ${OPENAI_TTS_TOTAL_TIMEOUT:-20}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1-mini}
      OPENAI_REALTIME_VAD_EAGERNESS: ${OPENAI_REALTIME_VAD_EAGERNESS:-auto}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID:-}
      CARTESIA_TTS_MODEL: ${CARTESIA_TTS_MODEL:-sonic-3.5}
      CARTESIA_API_VERSION: ${CARTESIA_API_VERSION:-2026-03-01}
      CARTESIA_TTS_TIMEOUT_SECONDS: ${CARTESIA_TTS_TIMEOUT_SECONDS:-12}
      CARTESIA_DAILY_CHARACTER_LIMIT: ${CARTESIA_DAILY_CHARACTER_LIMIT:-500}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_TTS_TIMEOUT_SECONDS: ${ELEVENLABS_TTS_TIMEOUT_SECONDS:-12}
      ELEVENLABS_DAILY_CHARACTER_LIMIT: ${ELEVENLABS_DAILY_CHARACTER_LIMIT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  bundle_cache:
